<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sanzio Contabilidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: barra lateral fixa de módulos + área de trabalho; fichas abrem em painel lateral. Vira abas no celular. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E9EEEC; --line:#D3DCD8; --fg:#15201C; --muted:#5A6A63;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#DAEDE6;
  --info:#2C5B8E; --info-soft:#DEE8F4; --warn:#8F5600; --warn-soft:#FAEBD3;
  --bad:#A2382C; --bad-soft:#F7DFDA; --ok:#2D6A2E; --ok-soft:#DCEEDA;
  --shadow:0 12px 40px rgba(16,32,26,.18);
  --f-display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#172019; --sunk:#0B100E; --line:#2A3631; --fg:#E3ECE8; --muted:#93A39C;
  --accent:#62C2A5; --accent-ink:#05241B; --accent-soft:#193A31;
  --info:#8DB6E6; --info-soft:#1A2B40; --warn:#E3A84E; --warn-soft:#3A2A12;
  --bad:#E78B7F; --bad-soft:#3F1F1B; --ok:#8DCB8E; --ok-soft:#1C3320; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#172019; --sunk:#0B100E; --line:#2A3631; --fg:#E3ECE8; --muted:#93A39C;
  --accent:#62C2A5; --accent-ink:#05241B; --accent-soft:#193A31;
  --info:#8DB6E6; --info-soft:#1A2B40; --warn:#E3A84E; --warn-soft:#3A2A12;
  --bad:#E78B7F; --bad-soft:#3F1F1B; --ok:#8DCB8E; --ok-soft:#1C3320; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.7rem} h2{font-size:1.2rem} h3{font-size:1rem}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:.78rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.side .foot{margin-top:auto;font-size:.75rem;color:var(--muted)}
.main{padding-block:28px 64px;padding-left:28px;padding-right:max(16px, env(safe-area-inset-right, 0px));min-width:0}
.wrap{max-width:1100px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.banner{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:.9rem}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--fg)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--f-mono);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat .s{font-size:.8rem;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0;width:260px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
td.r,th.r{text-align:right}
.name{font-weight:600}
.sub{font-size:.82rem;color:var(--muted)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);margin-left:6px;vertical-align:1px}

.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* Painel lateral (ficha) */
.scrim{position:fixed;inset:0;background:rgba(10,20,16,.42);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:calc(16px + env(safe-area-inset-top, 0px));padding-bottom:14px;padding-left:22px;padding-right:max(22px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-b{flex:1;overflow-y:auto;padding-block:18px 28px;padding-left:22px;padding-right:max(22px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:20px}
.sheet-f{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-left:22px;padding-right:max(22px, env(safe-area-inset-right, 0px));border-top:1px solid var(--line);background:var(--surface)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
legend{grid-column:1/-1;padding:0;margin-bottom:6px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:.8rem;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.f input.bad{border-color:var(--bad)}
.hint{font-size:.76rem;color:var(--muted)}
.hint.bad{color:var(--bad)}

.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.doc .ico{flex:none;width:34px;height:40px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.62rem;font-weight:500;color:var(--accent);background:var(--accent-soft)}
.doc .meta{flex:1;min-width:0}
.doc .meta a{color:var(--fg);font-weight:500;text-decoration:none;word-break:break-word}
.doc .meta a:hover{text-decoration:underline}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* Editor de orçamento */
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 64px 104px 96px 30px;gap:8px;align-items:center}
.item input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
.item input.q,.item input.p{text-align:right;font-family:var(--f-mono)}
.item .t{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.item-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow select{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 8px}
.totals{display:flex;flex-direction:column;gap:4px;align-items:flex-end;padding-top:10px;border-top:1px solid var(--line)}
.totals div{display:flex;gap:18px;justify-content:flex-end;min-width:240px}
.totals span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
.totals .grand{font-size:1.15rem;font-weight:600}
.totals .grand span:last-child{color:var(--accent)}

/* Prévia do documento */
.paper{background:#FFFFFF;color:#1B2420;border:1px solid var(--line);border-radius:4px;padding:26px 28px;font-size:.86rem;display:flex;flex-direction:column;gap:14px}
.paper .ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #1F6F5C;padding-bottom:10px}
.paper .ph b{font-family:var(--f-display);font-size:1.15rem;color:#1F6F5C;letter-spacing:.02em}
.paper table th{color:#5A6A63;border-bottom:1px solid #CBD6D1;padding:6px 4px;background:transparent}
.paper table td{border-bottom:1px solid #E3E9E6;padding:6px 4px}
.paper .tot{display:flex;justify-content:flex-end;gap:18px;font-weight:600;font-size:1rem}
.paper .small{font-size:.78rem;color:#5A6A63}
.paper .pix{display:flex;gap:16px;align-items:flex-start;border:1px solid #CBD6D1;border-radius:6px;padding:14px;background:#F6FAF8;flex-wrap:wrap}
.paper .pix-qr{flex:none;border:1px solid #CBD6D1;border-radius:4px;padding:4px;background:#fff}
.paper .pix-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.paper .pix dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:0;font-size:.82rem}
.paper .pix dt{color:#5A6A63}
.paper .pix dd{margin:0;word-break:break-all}
.paper .pix-code{font-size:.66rem;word-break:break-all;background:#fff;border:1px dashed #CBD6D1;border-radius:4px;padding:6px;color:#1B2420;user-select:all}
.pixbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.pixbox svg{border-radius:4px;padding:4px}
.pix-toggle{display:flex;gap:8px;align-items:center;font-size:.9rem}

.status-row{display:flex;gap:6px;flex-wrap:wrap}
.status-row button{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:.82rem}
.status-row button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.list-plain li:last-child{border-bottom:0}
.list-plain li.click{cursor:pointer}
.list-plain li.click:hover{background:var(--sunk)}

/* Consulta rápida */
.cq-bar{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:4px 6px 4px 14px}
.cq-bar input{flex:1;min-width:0;border:0;background:transparent;font-size:1.1rem;padding:10px 0;outline:none}
.cq-bar kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.cq{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
.cq-list{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow-y:auto}
.cq-list button{width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.cq-list button:hover{background:var(--sunk)}
.cq-list button[aria-current="true"]{background:var(--accent-soft)}
.cq-list button[aria-current="true"] .name{color:var(--accent)}
.card-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.kv .row{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);min-width:0}
.kv .row:nth-child(odd){border-right:1px solid var(--line)}
.kv .row .k{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kv .row .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;word-break:break-all}
.kv .row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.copy{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 9px;font-size:.8rem;cursor:pointer;color:var(--accent);font-weight:600;flex:none}
.copy:hover{border-color:var(--accent)}
.copy.done{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 6px;flex-wrap:wrap}
.acc{display:flex;flex-direction:column}
.acc .a{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:10px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.acc .a .who{font-weight:600}
.acc .a .who a{font-size:.78rem;font-weight:500;color:var(--accent);display:block}
.acc .a .cred{display:flex;flex-direction:column;gap:4px;min-width:0}
.acc .a .ln{display:flex;gap:8px;align-items:center;min-width:0}
.acc .a .ln .lbl{font-size:.72rem;color:var(--muted);width:52px;flex:none}
.acc .a .ln .v{font-family:var(--f-mono);word-break:break-all;flex:1;min-width:0}
.acc .a .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lock{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-top:1px solid var(--line);background:var(--sunk)}
.lock input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0;flex:1;max-width:260px}
.vault-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px}
.vault-pill.on{background:var(--ok-soft);color:var(--ok)}
.vault-pill.off{background:var(--sunk);color:var(--muted)}
.links{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}

.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
@media (max-width:860px){
  .cq{grid-template-columns:minmax(0,1fr)}
  .cq-list{max-height:220px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv .row:nth-child(odd){border-right:0}
  .acc .a{grid-template-columns:minmax(0,1fr)}
  .acc .a .acts{justify-content:flex-start}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;border-right:0;border-bottom:1px solid var(--line);padding-block:10px;padding-right:max(16px, env(safe-area-inset-right, 0px));overflow-x:auto}
  .side .foot,.brand small{display:none}
  .nav{flex-direction:row}
  .nav .count{display:none}
  .main{padding-left:max(16px, env(safe-area-inset-left, 0px))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  fieldset{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:minmax(0,1fr) 54px 88px 28px}
  .item .t,.item-h .ht{display:none}
  .paper{padding:18px}
}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:.6}} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>Sanzio</b><small>Contabilidade · clientes e orçamentos</small></div>
    <nav class="nav" id="nav">
      <a href="#consulta" data-r="consulta">Consulta rápida <span class="count">/</span></a>
      <a href="#painel" data-r="painel">Painel</a>
      <a href="#clientes" data-r="clientes">Clientes <span class="count" id="c-cli"></span></a>
      <a href="#orcamentos" data-r="orcamentos">Orçamentos <span class="count" id="c-orc"></span></a>
      <a href="#servicos" data-r="servicos">Serviços</a>
      <a href="#ajustes" data-r="ajustes">Ajustes</a>
    </nav>
    <div class="foot" id="mode">Conectando…</div>
  </aside>

function maskCNPJ(v){ const d = dig(v).slice(0,14); return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2'); }
function maskCPF(v){ const d = dig(v).slice(0,11); return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
function maskTel(v){ const d = dig(v).slice(0,11); if (d.length <= 10) return d.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{4})(\d)/,'$1-$2'); return d.replace(/^(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2'); }
function validCPF(v){ const d = dig(v); if (d.length!==11 || /^(\d)\1+$/.test(d)) return false;
  let s=0; for(let i=0;i<9;i++) s+= +d[i]*(10-i); let r=(s*10)%11; if(r===10) r=0; if(r!==+d[9]) return false;
  s=0; for(let i=0;i<10;i++) s+= +d[i]*(11-i); r=(s*10)%11; if(r===10) r=0; return r===+d[10]; }
function validCNPJ(v){ const d = dig(v); if (d.length!==14 || /^(\d)\1+$/.test(d)) return false;
  const calc = n => { const w = n===12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; let s=0; for(let i=0;i<n;i++) s+= +d[i]*w[i]; const r=s%11; return r<2?0:11-r; };

/* ---------- PIX (BR Code / padrão EMV do Banco Central) ---------- */
const PIX_TIPOS = {cpf:'CPF', cnpj:'CNPJ', email:'E-mail', telefone:'Telefone', aleatoria:'Chave aleatória'};
const semAcento = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '');
function pixChaveNormalizada(tipo, chave){
  const v = String(chave ?? '').trim();
  if (tipo === 'cpf' || tipo === 'cnpj') return dig(v);
  if (tipo === 'telefone'){ let d = dig(v); if (d.startsWith('55') && d.length >= 12) d = d.slice(2); return '+55' + d; }
  if (tipo === 'email') return v.toLowerCase();
  return v.toLowerCase();
}
function pixChaveErro(tipo, chave){
  const v = String(chave ?? '').trim(); if (!v) return 'Informe a chave PIX.';
  if (tipo === 'cpf' && !validCPF(v)) return 'O CPF da chave não confere.';
  if (tipo === 'cnpj' && !validCNPJ(v)) return 'O CNPJ da chave não confere.';
  if (tipo === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'O e-mail da chave não parece válido.';
  if (tipo === 'telefone'){ const d = pixChaveNormalizada(tipo, v).slice(3); if (d.length < 10 || d.length > 11) return 'Informe o telefone com DDD.'; }
  if (tipo === 'aleatoria' && !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)) return 'A chave aleatória tem o formato 123e4567-e89b-12d3-a456-426614174000.';
  return '';
}
const pixLimpo = (s, max) => semAcento(s).replace(/[^A-Za-z0-9 .,\-@/]/g, '').replace(/\s+/g, ' ').trim().slice(0, max);
function crc16(str){
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++){ crc ^= str.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
const emv = (id, val) => id + String(val.length).padStart(2, '0') + val;
function pixPayload({chave, nome, cidade, valor, txid}){
  const mai = emv('00', 'br.gov.bcb.pix') + emv('01', chave);
  let p = emv('00', '01') + emv('26', mai) + emv('52', '0000') + emv('53', '986');
  if (valor && Number(valor) > 0) p += emv('54', Number(valor).toFixed(2));
  p += emv('58', 'BR') + emv('59', nome) + emv('60', cidade);
  p += emv('62', emv('05', txid || '***'));
  p += '6304';
  return p + crc16(p);
}
function pixConfig(){
  const e = S.empresa;
  if (!e.pixChave || !e.pixNome || !e.pixCidade) return null;
  if (pixChaveErro(e.pixTipo, e.pixChave)) return null;
  return {tipo:e.pixTipo, chaveExibida:e.pixChave.trim(), chave:pixChaveNormalizada(e.pixTipo, e.pixChave),
    nome:pixLimpo(e.pixNome, 25), cidade:pixLimpo(e.pixCidade, 15), banco:(e.pixBanco||'').trim(), titular:(e.pixNome||'').trim()};
}
function pixDoOrc(d){

}
function qrMatrix(text){
  if (!window.qrcode) return null;
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); const m = []; for (let r = 0; r < n; r++){ const row = []; for (let c = 0; c < n; c++) row.push(q.isDark(r, c)); m.push(row); } return m; }
  catch(e){ return null; }
}
function qrSVG(text, px){
  const m = qrMatrix(text); if (!m) return '';
  const n = m.length, q = 4, size = n + q*2; let d = '';
  m.forEach((row, r) => row.forEach((on, c) => { if (on) d += `M${c+q} ${r+q}h1v1h-1z`; }));

}

/* ---------- cofre (criptografia no navegador) ----------
   A senha mestra nunca sai do navegador e nunca é gravada. O banco guarda só texto cifrado (AES-GCM, chave PBKDF2). */
const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { const a = new Uint8Array(buf); let s=''; for (const b of a) s += String.fromCharCode(b); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let vaultKey = null, plain = {}, lastAct = Date.now();
const VAULT_IDLE_MIN = 15;
const cryptoOk = !!(window.crypto && crypto.subtle);
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encWith(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(JSON.stringify(obj))); return {iv:b64(iv), ct:b64(ct)}; }
async function decWith(key, rec){ const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(rec.iv)}, key, unb64(rec.ct)); return JSON.parse(td.decode(pt)); }
async function criarCofre(pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)); const key = await deriveKey(pass, salt);
  const meta = {salt:b64(salt), check: await encWith(key, {ok:'sanzio'}), criadoEm: today()};
  if (!S.demo) await saveMeta('cofre', meta);
  S.cofreMeta = meta; vaultKey = key; await decryptAll(); render();
}
async function desbloquear(pass){
  if (!S.cofreMeta) return false;
  const key = await deriveKey(pass, unb64(S.cofreMeta.salt));
  try { const r = await decWith(key, S.cofreMeta.check); if (r.ok !== 'sanzio') return false; } catch(e){ return false; }
  vaultKey = key; lastAct = Date.now(); await decryptAll(); return true;
}
function bloquear(){ vaultKey = null; plain = {}; shown.clear(); render(); if (sheet?.tab === 'acessos'){ sheet.noFocus = true; drawSheet(); } }
async function decryptAll(){
  if (!vaultKey) return; const out = {};
  for (const r of S.cofre){ try { out[r.id] = await decWith(vaultKey, r); } catch(e){} }
  plain = out;
}
async function salvarAcessos(clienteId, obj){
  if (!vaultKey) throw new Error('locked');
  const rec = await encWith(vaultKey, obj);
  plain[clienteId] = obj;
  await put('cofre', clienteId, {...rec, atualizadoEm: today()});
}
const vaultOpen = () => !!vaultKey;

/* ---------- camada de dados (Firebase Firestore) ----------
   Tudo fica em users/{uid}/... — as regras do Firestore só deixam cada conta ler e gravar a própria pasta. */
const sortBy = (arr, f, dir=1) => arr.sort((a,b) => (a[f] > b[f] ? dir : a[f] < b[f] ? -dir : 0));
const ref = (...p) => doc(fs, 'users', user.uid, ...p);

async function put(col, id, data){

function listen(){

  unsubs.push(onSnapshot(ref('config','cofre'), s => { S.cofreMeta = s.exists() ? s.data() : null; S.loaded.cofreMeta = true; render(); }, onErr));
  unsubs.push(onSnapshot(ref('config','drive'), s => { S.drive = s.exists() ? s.data() : {}; }, onErr));

}

/* ---------- Google Drive (documentos dos clientes) ----------
   Escopo drive.file: o sistema só enxerga os arquivos e pastas que ele mesmo criou no seu Drive. */
const DRIVE = 'https://www.googleapis.com/drive/v3', DRIVE_UP = 'https://www.googleapis.com/upload/drive/v3';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
let driveTok = null, driveExp = 0;
const driveOn = () => !!driveTok && Date.now() < driveExp - 60000;
function guardarToken(result){
  const cred = GoogleAuthProvider.credentialFromResult(result);
  if (cred?.accessToken){ driveTok = cred.accessToken; driveExp = Date.now() + 55*60000; }
}
function provider(){ const p = new GoogleAuthProvider(); p.addScope(DRIVE_SCOPE); p.setCustomParameters({prompt:'select_account'}); return p; }
async function conectarDrive(){
  try { const r = await reauthenticateWithPopup(auth.currentUser, provider()); guardarToken(r); toast('Google Drive conectado.'); }
  catch(e){ toast(e.code === 'auth/popup-blocked' ? 'O navegador bloqueou a janela do Google. Libere pop-ups para este site.' : e.code === 'auth/user-mismatch' ? 'Escolha a mesma conta Google com que você entrou no sistema.' : 'Não foi possível conectar ao Drive.'); }
  if (sheet){ sheet.noFocus = true; drawSheet(); }
}
async function gapi(url, opts={}){
  if (!driveOn()) throw Object.assign(new Error('drive-off'), {code:'drive-off'});
  const r = await fetch(url, {...opts, headers:{Authorization:'Bearer ' + driveTok, ...(opts.headers||{})}});
  if (r.status === 401){ driveTok = null; throw Object.assign(new Error('drive-off'), {code:'drive-off'}); }
  if (!r.ok){ const t = await r.text().catch(() => ''); throw Object.assign(new Error(t), {code:'http-' + r.status}); }
  return r.status === 204 ? null : r.json();
}
async function criarPasta(nome, parent){
  const r = await gapi(DRIVE + '/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:nome, mimeType:'application/vnd.google-apps.folder', ...(parent ? {parents:[parent]} : {})})});
  return r.id;
}
async function pastaExiste(id){ if (!id) return false; try { const f = await gapi(`${DRIVE}/files/${id}?fields=id,trashed`); return f && !f.trashed; } catch(e){ if (e.code === 'drive-off') throw e; return false; } }
async function pastaRaiz(){
  if (await pastaExiste(S.drive?.rootId)) return S.drive.rootId;
  const id = await criarPasta(pastaDrive || 'Sanzio Contabilidade');
  S.drive = {...(S.drive||{}), rootId:id}; await saveMeta('drive', S.drive); return id;
}
async function pastaCliente(c){
  if (await pastaExiste(c.driveFolderId)) return c.driveFolderId;
  const root = await pastaRaiz();
  const id = await criarPasta(`${c.razao || c.responsavel}${c.cnpj ? ' — ' + maskCNPJ(c.cnpj) : ''}`, root);
  const fresh = cliOf(c.id); await put('clientes', c.id, {...strip(fresh), driveFolderId:id}); return id;
}
async function enviarArquivo(file, folderId, desc){
  const meta = {name:file.name, parents:[folderId], description:desc};
  const fields = 'id,name,size,mimeType,webViewLink';
  if (file.size <= 5*1024*1024){
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], {type:'application/json'}));
    form.append('file', file);
    return gapi(`${DRIVE_UP}/files?uploadType=multipart&fields=${fields}`, {method:'POST', body:form});
  }
  // Arquivos maiores: upload em duas etapas (resumable)
  const ini = await fetch(`${DRIVE_UP}/files?uploadType=resumable&fields=${fields}`, {method:'POST',
    headers:{Authorization:'Bearer ' + driveTok, 'Content-Type':'application/json; charset=UTF-8', 'X-Upload-Content-Type': file.type || 'application/octet-stream'},
    body: JSON.stringify(meta)});
  const loc = ini.ok && ini.headers.get('Location');
  if (!loc) throw Object.assign(new Error('resumable'), {code:'http-' + ini.status});
  const r = await fetch(loc, {method:'PUT', headers:{'Content-Type': file.type || 'application/octet-stream'}, body:file});
  if (!r.ok) throw Object.assign(new Error('upload'), {code:'http-' + r.status});
  return r.json();
}

const docId = c => c.cnpj ? maskCNPJ(c.cnpj) : c.cpf ? maskCPF(c.cpf) : '';
function nextNumero(){ const y = new Date().getFullYear(); const nums = S.orcamentos.filter(o => String(o.numero||'').startsWith(y+'-')).map(o => +String(o.numero).split('-')[1] || 0); return `${y}-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3,'0')}`; }
const pill = (st, map) => { const s = map[st] || {l:st, c:''}; return `<span class="pill ${s.c}">${esc(s.l)}</span>`; };

/* ---------- render principal ---------- */
function render(){
  $$('#nav a').forEach(a => a.setAttribute('aria-current', a.dataset.r === route ? 'page' : 'false'));
  $('#c-cli').textContent = S.clientes.length || '';
  const abertos = S.orcamentos.filter(o => o.status === 'enviado' || o.status === 'aprovado').length;
  $('#c-orc').textContent = abertos || '';
  const v = $('#view');
  const act = document.activeElement?.id;
  const keep = {}; ['vault-pass','vault-new','vault-new2'].forEach(id => { const el = $('#'+id, v); if (el && el.value) keep[id] = el.value; });
  v.innerHTML = ({consulta:vConsulta, painel:vPainel, clientes:vClientes, orcamentos:vOrcamentos, servicos:vServicos, ajustes:vAjustes}[route])();
  for (const [id,val] of Object.entries(keep)){ const el = $('#'+id, v); if (el) el.value = val; }
  if (act && v.querySelector('#'+act)){ const i = $('#'+act); i.focus(); if (i.setSelectionRange && i.type !== 'button') try { i.setSelectionRange(i.value.length, i.value.length); } catch(e){} }
}
const banner = () => S.demo ? `<div class="banner warn">Modo demonstração: os dados abaixo são exemplos e nada é salvo. Preencha o arquivo sistema/firebase-config.js para ativar o login e o banco de dados.</div>` : '';
const loading = col => !S.loaded[col] ? `<div class="empty">Carregando…</div>` : '';

/* ---------- consulta rápida ---------- */
function portais(){ return String(S.empresa.portais || PORTAIS_PADRAO).split('\n').map(l => { const i = l.indexOf('|'); return i < 0 ? null : {nome:l.slice(0,i).trim(), url:l.slice(i+1).trim()}; }).filter(p => p && p.nome && /^https:\/\//.test(p.url)); }
const portal = kw => portais().find(p => norm(p.nome).includes(kw));
const portalLink = (kw, txt) => { const p = portal(kw); return p ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(txt || 'Abrir ' + p.nome)} ↗</a>` : ''; };
function cqMatches(){
  const q = norm(cq.q), qd = dig(cq.q);
  let r = S.clientes;
  if (q) r = r.filter(c => norm(c.razao).includes(q) || norm(c.responsavel).includes(q) || (qd.length >= 3 && [c.cnpj, c.cpf, c.ie, c.im, c.nire].some(x => dig(x).includes(qd))));
  return sortBy([...r], 'razao');
}
function valueOf(cid, field){
  if (field.startsWith('acc.')){ const p = field.slice(4).split('.'); let v = plain[cid]; for (const k of p) v = v?.[k]; return v == null ? '' : String(v); }
  const c = cliOf(cid) || {};
  if (field === 'nascimento') return fmtDate(c.nascimento);
  if (['cnpj','cpf','ie','im','nire','telefone'].includes(field)) return dig(c[field]);
  return String(c[field] ?? '');
}
function fieldRow(cid, k, label, display){
  const raw = valueOf(cid, k);
  return `<div class="row"><div class="txt"><span class="k">${label}</span><span class="v">${raw ? esc(display ?? raw) : '<span class="muted">—</span>'}</span></div>${raw ? `<button class="copy" data-copy="${k}" data-cid="${cid}" aria-label="Copiar ${label}">Copiar</button>` : ''}</div>`;
}
function secretLine(cid, field, lbl){
  const v = valueOf(cid, field); const key = cid + '|' + field;
  if (!v) return `<div class="ln"><span class="lbl">${lbl}</span><span class="v muted">não cadastrado</span></div>`;
  return `<div class="ln"><span class="lbl">${lbl}</span><span class="v">${shown.has(key) ? esc(v) : '••••••••••'}</span><button class="btn ghost sm" data-show="${field}" data-cid="${cid}">${shown.has(key) ? 'Ocultar' : 'Mostrar'}</button><button class="copy" data-copy="${field}" data-cid="${cid}" aria-label="Copiar ${lbl}">Copiar</button></div>`;
}
function plainLine(cid, field, lbl, display){
  const v = valueOf(cid, field);
  if (!v) return `<div class="ln"><span class="lbl">${lbl}</span><span class="v muted">${field === 'cpf' ? 'cadastre o CPF' : field === 'im' ? 'cadastre a inscrição municipal' : 'não cadastrado'}</span></div>`;
  return `<div class="ln"><span class="lbl">${lbl}</span><span class="v">${esc(display ?? v)}</span><button class="copy" data-copy="${field}" data-cid="${cid}" aria-label="Copiar ${lbl}">Copiar</button></div>`;
}
function lockBox(msg){
  if (!cryptoOk) return `<div class="lock">O cofre não funciona neste navegador.</div>`;
  if (!S.cofreMeta) return `<div class="lock"><span>O cofre de senhas ainda não foi criado.</span><a class="btn sm primary" href="#ajustes">Criar cofre</a></div>`;
  return `<div class="lock"><span style="flex-basis:100%" class="sub">${msg || 'Digite a senha mestra para ver os acessos.'}</span>
    <input type="password" id="vault-pass" data-vault-pass autocomplete="current-password" placeholder="Senha mestra" aria-label="Senha mestra">
    <button class="btn primary sm" data-act="unlock">Desbloquear</button></div>`;
}
function acessosBlock(c){
  const id = c.id, p = plain[id] || {};
  if (!vaultOpen()) return lockBox(temAcessos(id) ? 'Este cliente tem acessos guardados. Digite a senha mestra para ver.' : '');
  const outros = (p.outros || []).filter(o => o.rotulo || o.usuario || o.senha);
  return `<div class="a"><div class="who">gov.br${portalLink('gov.br', 'Abrir gov.br')}${portalLink('e-cac', 'Abrir e-CAC')}</div>
      <div class="cred">${plainLine(id, 'cpf', 'Login', c.cpf ? maskCPF(c.cpf) : '')}${secretLine(id, 'acc.govSenha', 'Senha')}</div></div>
    <div class="a"><div class="who">Simples Nacional${portalLink('simples', 'Abrir Simples')}${c.tipo === 'MEI' ? portalLink('pgmei', 'Abrir PGMEI') : ''}</div>
      <div class="cred">${plainLine(id, 'cnpj', 'CNPJ', c.cnpj ? maskCNPJ(c.cnpj) : '')}${secretLine(id, 'acc.codSimples', 'Código')}</div></div>
    <div class="a"><div class="who">GISS Online${portalLink('giss', 'Abrir GISS')}</div>
      <div class="cred">${plainLine(id, 'im', 'Usuário')}${secretLine(id, 'acc.gissSenha', 'Senha')}</div></div>
    ${outros.map((o, i) => { const i0 = (p.outros||[]).indexOf(o); return `<div class="a"><div class="who">${esc(o.rotulo || 'Outro acesso')}${o.url && /^https:\/\//.test(o.url) ? `<a href="${esc(o.url)}" target="_blank" rel="noopener">Abrir ↗</a>` : ''}</div>
      <div class="cred">${o.usuario ? `<div class="ln"><span class="lbl">Usuário</span><span class="v">${esc(o.usuario)}</span><button class="copy" data-copy="acc.outros.${i0}.usuario" data-cid="${id}">Copiar</button></div>` : ''}${secretLine(id, `acc.outros.${i0}.senha`, 'Senha')}</div></div>`; }).join('')}`;
}
function vConsulta(){
  const list = cqMatches();
  if (!list.find(c => c.id === cq.sel)) cq.sel = list[Math.max(0, Math.min(cq.idx, list.length - 1))]?.id || null;
  const c = cliOf(cq.sel);
  const card = c ? `<section class="panel">
      <div class="card-h"><div style="min-width:0"><span class="label">${esc(c.tipo || '')}</span><h2>${esc(c.razao || c.responsavel)}${c.exemplo ? '<span class="tag">EXEMPLO</span>' : ''}</h2>${c.razao && c.responsavel ? `<div class="sub">${esc(c.responsavel)}</div>` : ''}</div>
        <div class="tools">${pill(c.status || 'ativo', STATUS_CLI)}<button class="btn sm" data-cli="${c.id}">Ficha completa</button></div></div>
      <div class="kv">
        ${fieldRow(c.id, 'cnpj', 'CNPJ', c.cnpj ? maskCNPJ(c.cnpj) : '')}
        ${fieldRow(c.id, 'cpf', 'CPF', c.cpf ? maskCPF(c.cpf) : '')}
        ${fieldRow(c.id, 'nascimento', 'Nascimento')}
        ${fieldRow(c.id, 'ie', 'Inscrição Estadual')}
        ${fieldRow(c.id, 'im', 'Inscrição Municipal')}
        ${fieldRow(c.id, 'nire', 'NIRE')}
        ${fieldRow(c.id, 'telefone', 'Telefone', c.telefone ? maskTel(c.telefone) : '')}
        ${fieldRow(c.id, 'email', 'E-mail')}
      </div>
      <div class="sec-h"><h3>Acessos</h3><div class="tools">${vaultOpen() ? `<span class="vault-pill on">Cofre aberto</span><button class="btn sm" data-act="edit-acc" data-cid="${c.id}">Editar acessos</button><button class="btn sm ghost" data-act="lock">Bloquear</button>` : `<span class="vault-pill off">Cofre bloqueado</span>`}</div></div>
      <div class="acc">${acessosBlock(c)}</div>
      ${c.certVence ? `<div class="links"><span class="sub">Certificado digital vence em <b class="mono" ${c.certVence < addDays(today(), 30) ? 'style="color:var(--bad)"' : ''}>${fmtDate(c.certVence)}</b></span></div>` : ''}
      <div class="links"><span class="sub" style="flex-basis:100%">CNPJ, CPF e inscrições são copiados só com os números.</span></div>
    </section>` : `<section class="panel"><div class="empty">${S.clientes.length ? 'Nenhum cliente encontrado.' : 'Nenhum cliente cadastrado ainda.'}</div></section>`;
  return `${banner()}
  <div class="cq-bar"><input id="cq-q" type="search" autocomplete="off" placeholder="Buscar cliente por nome, CNPJ, CPF ou inscrição" value="${esc(cq.q)}" aria-label="Buscar cliente"><kbd>/</kbd></div>
  <div class="cq">
    <section class="panel"><ul class="cq-list" role="listbox" aria-label="Clientes">${loading('clientes') || list.map(x => `<li><button data-cq="${x.id}" aria-current="${x.id === cq.sel}"><span class="name">${esc(x.razao || x.responsavel)}</span><span class="sub mono">${esc(docId(x)) || esc(x.tipo || '')}</span></button></li>`).join('')}</ul></section>
    ${card}
  </div>`;
}

function vPainel(){
  const mes = today().slice(0,7);
  const ativos = S.clientes.filter(c => c.status !== 'inativo').length;
  const env = S.orcamentos.filter(o => o.status === 'enviado');
  const apr = S.orcamentos.filter(o => o.status === 'aprovado');
  const pagos = S.orcamentos.filter(o => o.status === 'pago' && String(o.pagoEm||'').startsWith(mes));
  const sum = a => a.reduce((s,o) => s + total(o), 0);
  const recentes = sortBy([...S.orcamentos], 'data', -1).slice(0,6);
  const vencendo = S.orcamentos.filter(o => o.status === 'enviado' && o.validade && o.validade < today());
  return `${banner()}
  <div class="head"><div><h1>Painel</h1><p>${new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'})}</p></div>
    <div class="tools"><button class="btn" data-act="novo-cli">Novo cliente</button><button class="btn primary" data-act="novo-orc">Novo orçamento</button></div></div>
  <div class="stats">
    <div class="stat"><span class="label">Clientes ativos</span><span class="v">${ativos}</span><span class="s">${S.clientes.length} cadastrados</span></div>
    <div class="stat"><span class="label">Aguardando resposta</span><span class="v">${brl(sum(env))}</span><span class="s">${env.length} orçamento${env.length===1?'':'s'} enviado${env.length===1?'':'s'}</span></div>
    <div class="stat"><span class="label">A receber</span><span class="v">${brl(sum(apr))}</span><span class="s">${apr.length} aprovado${apr.length===1?'':'s'}</span></div>
    <div class="stat"><span class="label">Recebido no mês</span><span class="v">${brl(sum(pagos))}</span><span class="s">${pagos.length} pago${pagos.length===1?'':'s'} em ${new Date().toLocaleDateString('pt-BR',{month:'long'})}</span></div>
  </div>
  ${vencendo.length ? `<div class="banner">${vencendo.length} orçamento${vencendo.length>1?'s':''} enviado${vencendo.length>1?'s':''} passou da validade sem resposta: ${vencendo.map(o => `<a href="#" data-orc="${o.id}">nº ${esc(o.numero)}</a>`).join(', ')}.</div>` : ''}
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h2>Orçamentos recentes</h2><a class="btn sm ghost" href="#orcamentos">Ver todos</a></div>
      ${loading('orcamentos') || (recentes.length ? `<ul class="list-plain">${recentes.map(o => { const c = cliOf(o.clienteId); return `<li class="click" data-orc="${o.id}"><div style="min-width:0"><div class="name">${esc(c?.razao || o.clienteNome || 'Cliente removido')}</div><div class="sub mono">nº ${esc(o.numero)} · ${fmtDate(o.data)}</div></div><div style="text-align:right"><div class="num">${brl(total(o))}</div>${pill(o.status, STATUS_ORC)}</div></li>`; }).join('')}</ul>` : `<div class="empty">Nenhum orçamento ainda.<button class="btn primary" data-act="novo-orc">Montar o primeiro</button></div>`)}
    </section>
    <section class="panel"><div class="panel-h"><h2>Clientes</h2><a class="btn sm ghost" href="#clientes">Ver todos</a></div>
      ${loading('clientes') || (S.clientes.length ? `<ul class="list-plain">${sortBy([...S.clientes],'razao').slice(0,6).map(c => `<li class="click" data-cli="${c.id}"><div style="min-width:0"><div class="name">${esc(c.razao || c.responsavel)}${c.exemplo?'<span class="tag">EXEMPLO</span>':''}</div><div class="sub">${esc(c.tipo||'')}</div></div><span class="sub">${(c.docs||[]).length} doc.</span></li>`).join('')}</ul>` : `<div class="empty">Nenhum cliente cadastrado.<div class="tools"><button class="btn primary" data-act="novo-cli">Cadastrar</button><button class="btn" data-act="importar">Importar da planilha</button></div></div>`)}
    </section>
  </div>`;
}

  const q = norm(cliFilter.q), qd = dig(cliFilter.q);
  let rows = S.clientes.filter(c => (cliFilter.tipo === 'todos' || c.tipo === cliFilter.tipo) &&
    (!q || norm(c.razao).includes(q) || norm(c.responsavel).includes(q) || (qd && (dig(c.cnpj).includes(qd) || dig(c.cpf).includes(qd)))));
  rows = sortBy(rows, 'razao');

async function uploadFiles(files){
  if (S.demo || !sheet?.id) return;
  if (!driveOn()){ toast('Conecte o Google Drive antes de enviar.'); sheet.noFocus = true; drawSheet(); return; }
  const c = cliOf(sheet.id); if (!c) return;
  const cat = $('#d-cat')?.value || 'Outros';
  const novos = [];
  let folder;
  try { toast('Preparando a pasta no Drive…'); folder = await pastaCliente(c); }
  catch(e){ toast(e.code === 'drive-off' ? 'A conexão com o Drive expirou. Conecte de novo.' : 'Não foi possível criar a pasta no Drive.'); sheet.noFocus = true; drawSheet(); return; }
  for (const file of files){
    if (file.size > 25*1024*1024){ toast(`${file.name}: maior que 25 MB.`); continue; }
    toast(`Enviando ${file.name}…`);
    try {
      const r = await enviarArquivo(file, folder, `${cat} · ${c.razao || c.responsavel}`);
      novos.push({driveId:r.id, nome:r.name || file.name, categoria:cat, data:today(), size:Number(r.size) || file.size, tipo:r.mimeType || file.type, link:r.webViewLink || `https://drive.google.com/file/d/${r.id}/view`});
    } catch(e){ toast(e.code === 'drive-off' ? 'A conexão com o Drive expirou. Conecte de novo e reenvie.' : `${file.name}: não foi enviado. Tente de novo.`); if (e.code === 'drive-off') break; }
  }
  if (novos.length){
    const fresh = cliOf(sheet.id);
    await put('clientes', sheet.id, {...strip(fresh), docs:[...(fresh.docs||[]), ...novos]});
    toast(novos.length === 1 ? 'Documento guardado no Drive.' : `${novos.length} documentos guardados no Drive.`);
  }
  sheet.noFocus = true; drawSheet();
}
async function deleteDoc(key){
  const c = cliOf(sheet.id); if (!c) return;
  const d = (c.docs||[]).find(x => (x.driveId || x.assetId) === key);
  if (d?.driveId){
    try { await gapi(`${DRIVE}/files/${encodeURIComponent(d.driveId)}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trashed:true})}); }
    catch(e){ if (e.code === 'drive-off'){ toast('Conecte o Google Drive para excluir o arquivo.'); return; } if (e.code !== 'http-404'){ toast('Não foi possível excluir no Drive.'); return; } }
  }
  await put('clientes', sheet.id, {...strip(c), docs:(c.docs||[]).filter(x => (x.driveId || x.assetId) !== key)});
  toast('Documento movido para a lixeira do Drive.');
}
function baixarArquivo(blob, filename){
  const u = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
}
/* ---------- backup ---------- */
async function exportarBackup(){
  const out = {versao:1, exportadoEm:new Date().toISOString(), clientes:S.clientes, orcamentos:S.orcamentos, servicos:S.servicos, cofre:S.cofre, config:{empresa:S.empresa, cofre:S.cofreMeta}};
  baixarArquivo(new Blob([JSON.stringify(out, null, 2)], {type:'application/json'}), `backup-sanzio-${today()}.json`);
  toast('Backup baixado. Guarde em lugar seguro: ele tem os dados dos clientes.');
}
async function importarBackup(file){
  let j; try { j = JSON.parse(await file.text()); } catch(e){ toast('Arquivo de backup inválido.'); return; }
  const cols = ['clientes','orcamentos','servicos','cofre']; let n = 0;
  if (j.config?.cofre && S.cofreMeta && j.config.cofre.salt !== S.cofreMeta.salt && (j.cofre||[]).length){
    toast('Este sistema já tem um cofre com outra senha mestra. Os acessos do backup não foram importados.'); j.cofre = [];
  }
  for (const c of cols) for (const row of (j[c] || [])){ if (!row.id) continue; await put(c, row.id, strip(row)); n++; }
  if (j.config?.empresa) await saveEmpresa(j.config.empresa);
  if (j.config?.cofre && !S.cofreMeta){ await saveMeta('cofre', j.config.cofre); S.cofreMeta = j.config.cofre; }
  toast(`${n} registros importados do backup.`);
}

function gerarPDF(d){
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:'mm', format:'a4'});
  const c = cliOf(d.clienteId) || {}; const e = S.empresa;
  const M = 18, W = 210, R = W - M; let y = 22;

  doc.setFontSize(11); doc.setTextColor(20,30,26); doc.text(`Orçamento nº ${d.numero}`, R, y, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...grey);
  if (e.contato) doc.text(e.contato, M, y+5);
  doc.text(`Emitido em ${fmtDate(d.data)}  ·  válido até ${fmtDate(d.validade)}`, R, y+5, {align:'right'});

  if (sub){ y += 5; doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...grey); doc.text(sub, M, y); }
  y += 10;
  const cQ = 128, cU = 158, cT = R;
  doc.setFillColor(218,237,230); doc.rect(M, y-5, R-M, 8, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(20,30,26);
  doc.text('Serviço', M+2, y); doc.text('Qtd', cQ, y, {align:'right'}); doc.text('Unitário', cU, y, {align:'right'}); doc.text('Total', cT-2, y, {align:'right'});
  y += 8; doc.setFont('helvetica','normal');
  d.itens.forEach(it => {
    const lines = doc.splitTextToSize(String(it.nome), cQ - M - 16);

    doc.text(lines, M+2, y); doc.text(String(it.qtd), cQ, y, {align:'right'}); doc.text(brl(it.preco), cU, y, {align:'right'}); doc.text(brl(toNum(it.qtd)*toNum(it.preco)), cT-2, y, {align:'right'});
    y += lines.length*4.5 + 2.5; doc.setDrawColor(225,231,228); doc.setLineWidth(0.2); doc.line(M, y-3.5, R, y-3.5);
  });
  y += 3;
  if (toNum(d.desconto)){ doc.setTextColor(...grey); doc.text('Subtotal', cU, y, {align:'right'}); doc.text(brl(subtotal(d)), cT-2, y, {align:'right'}); y += 5; doc.text('Desconto', cU, y, {align:'right'}); doc.text('- ' + brl(d.desconto), cT-2, y, {align:'right'}); y += 6; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...green);
  doc.text('Valor total', cU, y+1, {align:'right'}); doc.text(brl(total(d)), cT-2, y+1, {align:'right'});
  y += 14; doc.setFontSize(9); doc.setTextColor(20,30,26);
  if (d.pagamento){ doc.setFont('helvetica','bold'); doc.text('Pagamento:', M, y); doc.setFont('helvetica','normal'); doc.text(d.pagamento, M+20, y); y += 6; }
  if (d.obs){ doc.setFont('helvetica','bold'); doc.text('Observações:', M, y); doc.setFont('helvetica','normal'); const l = doc.splitTextToSize(d.obs, R-M); doc.text(l, M, y+5); y += 5 + l.length*4.5; }
  const px = pixDoOrc(d), mtx = px && qrMatrix(px.codigo);
  if (px && mtx){
    const qs = 42, boxH = 54;
    if (y + boxH + 6 > 280){ doc.addPage(); y = 22; }
    y += 4;
    doc.setDrawColor(203,214,209); doc.setFillColor(246,250,248); doc.setLineWidth(0.3); doc.roundedRect(M, y, R-M, boxH, 2, 2, 'FD');
    const n = mtx.length, cell = qs / n, qx = M + 6, qy = y + 6;
    doc.setFillColor(255,255,255); doc.rect(qx-1.5, qy-1.5, qs+3, qs+3, 'F');
    doc.setFillColor(0,0,0);
    mtx.forEach((row, r) => { let c = 0; while (c < n){ if (row[c]){ let e = c; while (e < n && row[e]) e++; doc.rect(qx + c*cell, qy + r*cell, (e-c)*cell + 0.01, cell + 0.01, 'F'); c = e; } else c++; } });
    const tx = qx + qs + 8, tw = R - tx - 4; let ty = y + 10;
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...green); doc.text('Pague com PIX', tx, ty);
    ty += 5.5; doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...grey);
    doc.text(`Leia o QR Code no app do banco. O valor de ${brl(px.valor)} já vem preenchido.`, tx, ty);
    ty += 6; doc.setTextColor(20,30,26); doc.setFontSize(9);
    const lin = [[`Chave (${pixTipoLabel(px.tipo)})`, px.chaveExibida], ['Favorecido', px.titular], ...(px.banco ? [['Banco', px.banco]] : [])];
    lin.forEach(([k, v]) => { doc.setFont('helvetica','bold'); doc.text(k + ':', tx, ty); doc.setFont('helvetica','normal'); doc.text(String(v), tx + 32, ty); ty += 4.6; });
    ty += 1.5; doc.setFontSize(7); doc.setTextColor(...grey); doc.text('PIX copia e cola:', tx, ty); ty += 3.4;
    doc.setFont('courier','normal'); doc.setFontSize(6.3); doc.setTextColor(20,30,26);
    const cl = doc.splitTextToSize(px.codigo, tw); doc.text(cl.slice(0, 5), tx, ty);
    doc.setFont('helvetica','normal'); y += boxH + 4;
  }
  doc.setFontSize(8); doc.setTextColor(...grey); doc.text(`${e.nome} · Orçamento nº ${d.numero}`, M, 287);
  return doc.output('blob');
}

function parseCSV(text){
  const sep = (text.split('\n')[0].match(/;/g)||[]).length > (text.split('\n')[0].match(/,/g)||[]).length ? ';' : (text.includes('\t') ? '\t' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for (let i=0;i<text.length;i++){ const ch = text[i];
    if (q){ if (ch === '"' && text[i+1] === '"'){ cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true; else if (ch === sep){ row.push(cur); cur=''; } else if (ch === '\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if (ch !== '\r') cur += ch; }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const COLMAP = h => { const n = norm(h);
  if (/senha\s*gov|gov.*senha/.test(n)) return '__acc:govSenha';
  if (/cod.*acesso|codigo.*acesso/.test(n)) return '__acc:codSimples';
  if (/senha|password/.test(n)) return '__acc:gissSenha';
  if (n.includes('nome empresarial') || n.includes('razao')) return 'razao';
  if (n === 'nome' || n.includes('responsavel')) return 'responsavel';
  if (n.includes('cnpj')) return 'cnpj'; if (n === 'cpf' || n.includes('cpf')) return 'cpf';
  if (n.includes('estadual')) return 'ie'; if (n.includes('giss') || n.includes('municipal')) return 'im';
  if (n.includes('nire')) return 'nire'; if (n.includes('nascimento')) return 'nascimento';
  if (n.includes('telefone') || n.includes('whats') || n.includes('celular')) return 'telefone'; if (n.includes('mail')) return 'email';
  return null; };
function toISO(v){ const m = String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : ''; }
function guessTipo(c){ if (!c.cnpj) return 'Pessoa física'; if (/ltda|s\/?a\b|eireli/i.test(c.razao)) return 'ME / LTDA'; if (/^\d{2}\.?\d{3}\.?\d{3}/.test(c.razao) || /^\d{3}\.\d{3}\.\d{3}-\d{2}/.test(c.razao)) return 'MEI'; return 'ME / LTDA'; }

function buildImportPreview(){

  const accCols = head.filter((h,i) => String(map[i]||'').startsWith('__acc:') && h.trim());
  const porChave = new Map(); S.clientes.forEach(c => { if (c.cnpj) porChave.set(dig(c.cnpj), c.id); if (c.cpf && !c.cnpj) porChave.set(dig(c.cpf), c.id); });
  let dup = 0, comAcesso = 0; const novos = [], accOnly = [];
  for (const r of rows.slice(1)){
    const c = {}, acc = {};
    map.forEach((k,i) => { const v = String(r[i]??'').trim().replace(/'$/,''); if (!k || !v) return; if (k.startsWith('__acc:')) acc[k.slice(6)] = v; else c[k] = v; });
    if (!c.razao && !c.responsavel) continue;
    c.cnpj = dig(c.cnpj); c.cpf = dig(c.cpf); c.telefone = dig(c.telefone);
    if (c.cnpj.length && c.cnpj.length < 14) c.cnpj = c.cnpj.padStart(14,'0');
    if (c.cpf.length && c.cpf.length < 11) c.cpf = c.cpf.padStart(11,'0');
    if (c.nascimento) c.nascimento = toISO(c.nascimento);
    const razaoOrig = c.razao || c.responsavel;
    if (!c.razao) c.razao = c.responsavel;
    c.razao = c.razao.replace(/^\d{2}\.\d{3}\.\d{3}\s*-?\s*/, '').replace(/^\d{3}\.\d{3}\.\d{3}-\d{2}\s*-\s*/, '').trim() || c.razao;
    const temAcc = Object.keys(acc).length > 0;
    const key = c.cnpj || c.cpf;
    if (key && porChave.has(key)){ dup++; if (temAcc){ accOnly.push({id: porChave.get(key), acc}); comAcesso++; } continue; }
    c.tipo = guessTipo({...c, razao: razaoOrig}); c.status = 'ativo'; c.docs = []; c.criadoEm = today();
    if (temAcc){ c.__acc = acc; comAcesso++; }
    if (key) porChave.set(key, '__novo');
    novos.push(c);
  }
  sheet.preview = {novos, dup, accCols, accOnly, comAcesso}; sheet.noFocus = true; drawSheet();
}
async function confirmImport(){
  const p = sheet.preview; if (!p) return;
  let nAcc = 0;
  for (const c of p.novos){
    const id = uid(); const acc = c.__acc; const data = {...c}; delete data.__acc;
    await put('clientes', id, data);
    if (acc && vaultOpen()){ await salvarAcessos(id, {...acc, outros:[]}); nAcc++; }
  }
  if (vaultOpen()) for (const {id, acc} of p.accOnly){
    const atual = plain[id] || {outros:[]}; const merged = {...atual};
    for (const [k,v] of Object.entries(acc)) if (!merged[k]) merged[k] = v;
    await salvarAcessos(id, merged); nAcc++;
  }
  toast(`${p.novos.length} cliente${p.novos.length===1?'':'s'} importado${p.novos.length===1?'':'s'}${nAcc ? `, ${nAcc} com acessos no cofre` : ''}.`);
  closeSheet(); location.hash = 'consulta';
}

/* ---------- eventos ---------- */
const armed = new WeakSet();
function confirmClick(btn, label){ if (armed.has(btn)) return true; armed.add(btn); btn.classList.add('armed'); const old = btn.textContent; btn.textContent = label || 'Confirmar exclusão'; setTimeout(() => { armed.delete(btn); btn.classList.remove('armed'); btn.textContent = old; }, 3500); return false; }

document.addEventListener('click', async ev => {
  const t = ev.target.closest('button, a, tr, li'); if (!t) return;
  const a = t.dataset.act;
  if (t.dataset.copy){ copyText(valueOf(t.dataset.cid, t.dataset.copy), t, t.dataset.copy.startsWith('acc.') && !t.dataset.copy.endsWith('usuario')); return; }
  if (t.dataset.show){ const k = t.dataset.cid + '|' + t.dataset.show; shown.has(k) ? shown.delete(k) : shown.add(k); render(); return; }
  if (t.dataset.cq){ cq.sel = t.dataset.cq; cq.idx = cqMatches().findIndex(c => c.id === cq.sel); shown.clear(); render(); return; }
  if (t.dataset.rmOutro != null){ readAccForm(); sheet.accDraft.outros.splice(+t.dataset.rmOutro, 1); sheet.noFocus = true; drawSheet(); return; }
  if (a === 'unlock'){ await tryUnlock(t.closest('.lock')?.querySelector('input'), t); return; }
  if (t.dataset.cli){ ev.preventDefault(); openSheet({kind:'cliente', id:t.dataset.cli, tab:'dados'}); return; }
  if (t.dataset.orc){ ev.preventDefault(); const o = S.orcamentos.find(x => x.id === t.dataset.orc); if (o) openSheet({kind:'orc', id:o.id, draft: JSON.parse(JSON.stringify(strip(o))), tab:'previa'}); return; }
  if (t.dataset.serv){ openSheet({kind:'serv', id:t.dataset.serv}); return; }
  if (t.dataset.tipo){ cliFilter.tipo = t.dataset.tipo; render(); return; }
  if (t.dataset.st){ orcFilter = t.dataset.st; render(); return; }
  if (t.dataset.tab){ if (sheet.kind === 'orc') syncDraft(); if ($('#f-acc')) readAccForm(); sheet.tab = t.dataset.tab; sheet.noFocus = true; drawSheet(); return; }
  if (t.dataset.rm != null){ sheet.draft.itens.splice(+t.dataset.rm, 1); $('#items').innerHTML = itemsHTML(sheet.draft); updateTotals(); return; }
  if (t.dataset.setSt){ const d = sheet.draft; const st = t.dataset.setSt; d.status = st;
    if (st === 'enviado' && !d.enviadoEm) d.enviadoEm = today(); if (st === 'pago') d.pagoEm = d.pagoEm || today(); if (st !== 'pago') delete d.pagoEm;
    if (await saveOrc(true)){ toast(`Situação: ${STATUS_ORC[st].l}.`); sheet.noFocus = true; drawSheet(); } return; }
  if (t.dataset.delDoc){ if (!confirmClick(t, 'Confirmar')) return; await deleteDoc(t.dataset.delDoc); return; }
  switch (a){
    case 'fechar': closeSheet(); break;
    case 'novo-cli': openSheet({kind:'cliente', id:null, tab:'dados'}); break;
    case 'novo-orc': openSheet({kind:'orc', id:null, draft:newDraft(), tab:'editar'}); break;
    case 'orc-cli': openSheet({kind:'orc', id:null, draft:newDraft(sheet.id), tab:'editar'}); break;
    case 'novo-serv': openSheet({kind:'serv', id:null}); break;
    case 'importar': openSheet({kind:'importar'}); break;
    case 'salvar-cli': await saveCliente(); break;
    case 'del-cli': if (!confirmClick(t)) return; { const id = sheet.id; await remove('clientes', id); if (temAcessos(id)) await remove('cofre', id); delete plain[id]; } toast('Cliente excluído.'); closeSheet(); break;
    case 'lock': bloquear(); toast('Cofre bloqueado.'); break;
    case 'conectar-drive': await conectarDrive(); break;
    case 'exportar-backup': await exportarBackup(); break;
    case 'importar-backup': $('#bk-file').click(); break;
    case 'seed-serv': for (const sv of SERVICOS_PADRAO) await put('servicos', sv.id, strip(sv)); toast('Serviços padrão adicionados.'); break;
    case 'edit-acc': openSheet({kind:'cliente', id:t.dataset.cid, tab:'acessos'}); break;
    case 'add-outro': readAccForm(); sheet.accDraft.outros.push({rotulo:'', usuario:'', senha:'', url:''}); sheet.noFocus = true; drawSheet(); $$('[data-o-f="rotulo"]').pop()?.focus(); break;
    case 'salvar-acc': {
      const p = readAccForm(); p.outros = p.outros.filter(o => o.rotulo || o.usuario || o.senha);
      for (const o of p.outros) if (o.url && !/^https:\/\//.test(o.url)) o.url = /^[\w.-]+\.[a-z]{2,}/i.test(o.url) ? 'https://' + o.url : '';
      try { await salvarAcessos(sheet.id, p); sheet.accDraft = null; toast('Acessos guardados no cofre.'); render(); sheet.noFocus = true; drawSheet(); }
      catch(e){ toast(e.message === 'locked' ? 'O cofre foi bloqueado. Desbloqueie e salve de novo.' : 'Não foi possível salvar os acessos.'); }
      break; }
    case 'criar-cofre': {
      const p1 = $('#vault-new')?.value || '', p2 = $('#vault-new2')?.value || '';
      if (p1.length < 10){ toast('Use pelo menos 10 caracteres na senha mestra.'); return; }
      if (p1 !== p2){ toast('As duas senhas não são iguais.'); return; }
      t.disabled = true; t.textContent = 'Criando…';
      try { await criarCofre(p1); toast('Cofre criado e aberto.'); } catch(e){ toast('Não foi possível criar o cofre.'); t.disabled = false; t.textContent = 'Criar cofre'; }
      break; }
    case 'salvar-serv': await saveServ(); break;
    case 'del-serv': if (!confirmClick(t)) return; await remove('servicos', sheet.id); toast('Serviço excluído.'); closeSheet(); break;
    case 'salvar-orc': syncDraft(); if (await saveOrc()){ sheet.tab = 'previa'; sheet.noFocus = true; drawSheet(); } break;
    case 'del-orc': if (!confirmClick(t)) return; await remove('orcamentos', sheet.id); toast('Orçamento excluído.'); closeSheet(); break;
    case 'item-livre': syncDraft(); sheet.draft.itens.push({nome:'', qtd:1, preco:0}); $('#items').innerHTML = itemsHTML(sheet.draft); updateTotals(); $$('#items [data-it="nome"]').pop()?.focus(); break;
    case 'upload': $('#d-file').click(); break;
    case 'imp-escolher': $('#imp-file').click(); break;
    case 'imp-confirmar': await confirmImport(); break;
    case 'copiar-pix': { const px = pixDoOrc(sheet.draft); if (px) copyText(px.codigo, t, true); break; }
    case 'copiar-msg': { const txt = msgText(sheet.draft); try { await navigator.clipboard.writeText(txt); toast('Mensagem copiada. Cole no WhatsApp ou no e-mail.'); } catch(e){ showCopyFallback(txt); } break; }
    case 'pdf': {
      if (!sheet.id){ if (!(await saveOrc(true))) return; }
      const d = sheet.draft; const c = cliOf(d.clienteId);
      const nome = norm(c?.razao || c?.responsavel || 'cliente').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
      try { baixarArquivo(gerarPDF(d), `Orcamento-${d.numero}-${nome}.pdf`); toast('PDF baixado.'); }
      catch(e){ toast('Não foi possível gerar o PDF.'); }
      break; }
  }
});
function copyText(v, btn, secret){
  if (!v) return;
  const ok = () => { if (btn){ const o = btn.textContent; btn.classList.add('done'); btn.textContent = 'Copiado'; setTimeout(() => { btn.classList.remove('done'); btn.textContent = o; }, 1300); } toast(secret ? 'Copiado. Cole direto no portal.' : `Copiado: ${v}`); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = v; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); let done = false; try { done = document.execCommand('copy'); } catch(e){} ta.remove(); done ? ok() : toast('Não consegui copiar automaticamente. Use Mostrar e copie à mão.'); };
  try { navigator.clipboard.writeText(v).then(ok, fallback); } catch(e){ fallback(); }
}
async function tryUnlock(input, btn){
  const pass = input?.value || '';
  if (!pass){ input?.focus(); toast('Digite a senha mestra.'); return; }
  if (btn){ btn.disabled = true; btn.textContent = 'Abrindo…'; }
  const ok = await desbloquear(pass);
  if (!ok){ if (btn){ btn.disabled = false; btn.textContent = 'Desbloquear'; } if (input){ input.value = ''; input.focus(); } toast('Senha mestra incorreta.'); return; }
  toast('Cofre aberto.'); render(); if (sheet){ sheet.noFocus = true; if (sheet.kind === 'importar' && sheet.rawText) buildImportPreview(); else drawSheet(); }
}
function showCopyFallback(txt){ const b = $('.sheet-b'); if (!b) return; const ta = document.createElement('textarea'); ta.value = txt; ta.rows = 10; ta.style.cssText = 'width:100%;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface)'; ta.setAttribute('aria-label','Mensagem do orçamento'); b.prepend(ta); ta.focus(); ta.select(); toast('Selecionei o texto. Use Ctrl+C para copiar.'); }

function syncDraft(){
  if (!sheet || sheet.kind !== 'orc') return;
  $$('[data-o]').forEach(el => { const k = el.dataset.o; sheet.draft[k] = k === 'desconto' ? toNum(el.value) : el.value; });
  const px = $('#o-pix'); if (px && !px.disabled){ if (px.checked) delete sheet.draft.semPix; else sheet.draft.semPix = true; }
  $$('#items .item[data-i]').forEach(row => { const it = sheet.draft.itens[+row.dataset.i]; if (!it) return; $$('[data-it]', row).forEach(inp => { it[inp.dataset.it] = inp.dataset.it === 'nome' ? inp.value : toNum(inp.value); }); });
}
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'cli-q'){ cliFilter.q = el.value; render(); return; }
  if (el.id === 'e-pixchave'){ const h = $('#h-pix'); if (h){ const err = el.value.trim() ? pixChaveErro($('#e-pixtipo').value, el.value) : ''; h.textContent = err; h.classList.toggle('bad', !!err); } return; }
  if (el.id === 'cq-q'){ cq.q = el.value; cq.idx = 0; cq.sel = null; shown.clear(); render(); return; }
  if (el.dataset.mask){ const pos = el.value.length; el.value = el.dataset.mask === 'cnpj' ? maskCNPJ(el.value) : el.dataset.mask === 'cpf' ? maskCPF(el.value) : maskTel(el.value);
    if (el.dataset.mask !== 'tel'){ const d = dig(el.value), full = el.dataset.mask === 'cnpj' ? 14 : 11; const ok = el.dataset.mask === 'cnpj' ? validCNPJ(d) : validCPF(d); const h = $('#h-' + el.dataset.mask);
      el.classList.toggle('bad', d.length === full && !ok); if (h){ h.textContent = d.length === full ? (ok ? 'Dígitos conferem.' : 'Dígito verificador não confere.') : ''; h.classList.toggle('bad', d.length === full && !ok); } } return; }
  if (sheet?.kind === 'orc' && (el.dataset.it || el.dataset.o === 'desconto')){ syncDraft(); updateTotals(); }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.id === 'o-add' && el.value){ syncDraft(); const s = S.servicos.find(x => x.id === el.value); if (s){ const ex = sheet.draft.itens.find(i => i.servicoId === s.id); if (ex) ex.qtd = toNum(ex.qtd) + 1; else sheet.draft.itens.push({servicoId:s.id, nome:s.nome, qtd:1, preco:s.preco}); }
    el.value = ''; $('#items').innerHTML = itemsHTML(sheet.draft); updateTotals(); return; }
  if (el.id === 'o-cli'){ syncDraft(); sheet.noFocus = true; drawSheet(); return; }
  if (el.id === 'a-ver'){ $$('#f-acc input[data-acc], #f-acc [data-o-f="senha"]').forEach(i => i.type = el.checked ? 'text' : 'password'); return; }
  if (el.id === 'd-file' && el.files.length){ await uploadFiles([...el.files]); el.value = ''; return; }
  if (el.id === 'bk-file' && el.files[0]){ await importarBackup(el.files[0]); el.value = ''; return; }
  if (el.id === 'imp-file' && el.files[0]){ await readImport(el.files[0]); el.value = ''; return; }
  if (el.dataset.it === 'preco' || el.dataset.o === 'desconto'){ el.value = toNum(el.value) ? money2(toNum(el.value)) : ''; }
});
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  if (ev.target.id === 'f-emp'){
    const o = Object.fromEntries(new FormData(ev.target).entries());
    for (const k of Object.keys(o)) o[k] = String(o[k]).trim();
    if (o.pixChave || o.pixNome || o.pixCidade){
      const err = pixChaveErro(o.pixTipo, o.pixChave);
      if (err){ toast(err); $('#e-pixchave').focus(); return; }
      if (!o.pixNome){ toast('Informe o nome do recebedor do PIX.'); $('#e-pixnome').focus(); return; }
      if (!o.pixCidade){ toast('Informe a cidade do recebedor do PIX.'); $('#e-pixcidade').focus(); return; }
    }
    await saveEmpresa({...o, validade: Number(o.validade)||15}); toast('Ajustes salvos.'); }
});
document.addEventListener('keydown', ev => {
  const el = ev.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  if (ev.key === 'Escape' && sheet){ closeSheet(); return; }
  if ((ev.key === '/' && !typing) || ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k')){
    ev.preventDefault(); closeSheet(); if (route !== 'consulta') location.hash = 'consulta'; setTimeout(() => { const i = $('#cq-q'); if (i){ i.focus(); i.select(); } }, 0); return; }
  if (el.matches?.('[data-vault-pass]') && ev.key === 'Enter'){ ev.preventDefault(); tryUnlock(el, el.closest('.lock')?.querySelector('button')); return; }
  if (el.id === 'vault-new2' && ev.key === 'Enter'){ ev.preventDefault(); $('[data-act="criar-cofre"]')?.click(); return; }
  if (el.id === 'cq-q' && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp' || ev.key === 'Enter')){
    const list = cqMatches(); if (!list.length) return; ev.preventDefault();
    let i = Math.max(0, list.findIndex(c => c.id === cq.sel));
    if (ev.key === 'ArrowDown') i = Math.min(list.length - 1, i + 1); else if (ev.key === 'ArrowUp') i = Math.max(0, i - 1);
    cq.idx = i; cq.sel = list[i].id; shown.clear(); render();
    if (ev.key === 'Enter') $('.kv .copy')?.focus();
  }
});
document.addEventListener('dragover', ev => { const d = ev.target.closest?.('#drop'); if (d){ ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', ev => { ev.target.closest?.('#drop')?.classList.remove('over'); });
document.addEventListener('drop', async ev => { const d = ev.target.closest?.('#drop'); if (!d) return; ev.preventDefault(); d.classList.remove('over'); if (ev.dataTransfer.files.length) await uploadFiles([...ev.dataTransfer.files]); });

/* ---------- início: login com Google ---------- */
const configurado = firebaseConfig && firebaseConfig.apiKey && !/^COLE/.test(firebaseConfig.apiKey);
let fbApp = null, auth = null, fs = null;
function telaLogin(msg){
  const r = $('#login-root');
  r.innerHTML = `<div class="login"><div class="login-card">
    <div class="brand"><b>Sanzio</b><small>Contabilidade · clientes e orçamentos</small></div>
    <p class="muted" style="margin:0">Entre com a sua conta Google. Os dados ficam no seu Firebase e os documentos no seu Google Drive.</p>
    <button class="btn primary" id="btn-login" style="justify-content:center;padding:10px 14px">Entrar com Google</button>
    ${msg ? `<div class="hint bad">${esc(msg)}</div>` : ''}
  </div></div>`;
  $('#btn-login').onclick = async () => {
    try { const r = await signInWithPopup(auth, provider()); guardarToken(r); }
    catch(e){ telaLogin(e.code === 'auth/unauthorized-domain' ? 'Este endereço não está autorizado no Firebase (Authentication › Configurações › Domínios autorizados).' : e.code === 'auth/popup-blocked' ? 'O navegador bloqueou a janela do Google. Libere pop-ups para este site.' : e.code === 'auth/popup-closed-by-user' ? '' : 'Não foi possível entrar. Tente de novo.'); }
  };
}
function contaUI(){
  const f = $('#mode');
  if (S.demo){ f.textContent = 'Modo demonstração'; return; }
  f.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px"><span>Dados salvos no Firebase</span><span class="mono" style="word-break:break-all">${esc(user?.email || '')}</span><button class="btn sm" id="btn-sair" style="align-self:flex-start">Sair</button></div>`;
  $('#btn-sair').onclick = async () => { bloquear(); driveTok = null; await signOut(auth); };
}
function limparEstado(){
  unsubs.forEach(u => u()); unsubs = [];
  Object.assign(S, {clientes:[], orcamentos:[], servicos:[], cofre:[], cofreMeta:null, drive:{}, loaded:{}});
  closeSheet();
}
async function boot(){
  go();
  if (!configurado){ demoData(); setMode('Modo demonstração'); render(); return; }
  fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  try { fs = initializeFirestore(fbApp, {ignoreUndefinedProperties:true, localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
  catch(e){ fs = initializeFirestore(fbApp, {ignoreUndefinedProperties:true}); }
  onAuthStateChanged(auth, async u => {
    user = u;
    if (!u){ limparEstado(); render(); telaLogin(); return; }
    $('#login-root').innerHTML = '';
    contaUI(); listen(); render();
  });
}
boot();
